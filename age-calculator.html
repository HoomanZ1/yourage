<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محاسبه‌گر سن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #0c1224;
    --bg-panel: #131a33;
    --bg-panel-2: #1a2440;
    --gold: #cfa34d;
    --gold-soft: #e8c97a;
    --teal: #3a8f8a;
    --parchment: #f2e9d8;
    --parchment-dim: #b9b0a0;
    --ring: rgba(207,163,77,0.35);
    --hairline: rgba(242,233,216,0.12);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    min-height:100vh;
    background: radial-gradient(ellipse at 50% -10%, #1a2247 0%, var(--bg-deep) 55%, #070a15 100%);
    color: var(--parchment);
    font-family: 'Vazirmatn', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 20px;
    overflow-x:hidden;
  }

  /* starfield */
  .stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, rgba(242,233,216,0.6), transparent),
      radial-gradient(1px 1px at 25% 65%, rgba(242,233,216,0.4), transparent),
      radial-gradient(2px 2px at 70% 15%, rgba(242,233,216,0.5), transparent),
      radial-gradient(1px 1px at 85% 40%, rgba(242,233,216,0.35), transparent),
      radial-gradient(1.5px 1.5px at 55% 80%, rgba(242,233,216,0.45), transparent),
      radial-gradient(1px 1px at 40% 30%, rgba(242,233,216,0.3), transparent),
      radial-gradient(1.5px 1.5px at 92% 75%, rgba(242,233,216,0.4), transparent),
      radial-gradient(1px 1px at 15% 85%, rgba(242,233,216,0.3), transparent);
    background-repeat: no-repeat;
    z-index:0;
  }

  .stage{
    position:relative;
    width:100%;
    max-width: 460px;
    z-index:1;
  }

  /* decorative astrolabe rings behind the card */
  .astrolabe{
    position:absolute;
    inset: -60px -60px auto -60px;
    top: -70px;
    display:flex;
    justify-content:center;
    z-index:0;
    pointer-events:none;
  }
  .astrolabe svg{
    width: 340px;
    height: 340px;
    opacity: 0.5;
  }

  .card{
    position:relative;
    background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border: 1px solid var(--hairline);
    border-radius: 22px;
    padding: 44px 34px 38px;
    box-shadow:
      0 30px 60px -25px rgba(0,0,0,0.65),
      0 0 0 1px rgba(207,163,77,0.06) inset;
    z-index:1;
  }

  .eyebrow-row{
    display:flex;
    align-items:center;
    gap:10px;
    justify-content:center;
    margin-bottom: 6px;
  }
  .eyebrow-row svg{ width:18px; height:18px; opacity:0.85; }

  h1{
    margin: 0 0 8px;
    text-align:center;
    font-size: 26px;
    font-weight: 700;
    color: var(--parchment);
    letter-spacing: 0.2px;
  }

  .sub{
    text-align:center;
    color: var(--parchment-dim);
    font-size: 14px;
    font-weight: 400;
    margin: 0 0 30px;
    line-height:1.8;
  }

  form{
    display:flex;
    flex-direction:column;
    gap: 18px;
  }

  label{
    font-size: 13px;
    color: var(--gold-soft);
    font-weight: 500;
    margin-bottom: 8px;
    display:block;
  }

  .field{
    position:relative;
  }

  input[type="date"]{
    width:100%;
    background: rgba(7,10,21,0.55);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--parchment);
    font-family: 'Vazirmatn', sans-serif;
    font-size: 16px;
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease;
    color-scheme: dark;
  }

  input[type="date"]:focus{
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(207,163,77,0.18);
  }

  button{
    margin-top: 6px;
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    color: #221607;
    border: none;
    border-radius: 12px;
    padding: 15px 18px;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    box-shadow: 0 10px 24px -10px rgba(207,163,77,0.55);
  }
  button:hover{ filter: brightness(1.05); transform: translateY(-1px); }
  button:active{ transform: translateY(0px) scale(0.99); }
  button:focus-visible{ outline: 3px solid var(--teal); outline-offset: 3px; }

  .error{
    color: #e6a1a1;
    font-size: 13px;
    text-align:center;
    min-height: 18px;
    margin-top: -6px;
  }

  /* results */
  .result{
    margin-top: 28px;
    padding-top: 26px;
    border-top: 1px solid var(--hairline);
    display:none;
  }
  .result.show{ display:block; }

  .dials{
    display:flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 22px;
  }

  .dial{
    flex:1;
    text-align:center;
    position:relative;
    padding: 18px 6px 14px;
    border-radius: 14px;
    background: rgba(7,10,21,0.4);
    border: 1px solid var(--hairline);
  }

  .dial .num{
    font-size: 30px;
    font-weight: 900;
    color: var(--gold-soft);
    line-height:1;
    font-variant-numeric: tabular-nums;
  }

  .dial .lbl{
    margin-top: 8px;
    font-size: 12px;
    color: var(--parchment-dim);
    font-weight: 500;
  }

  .dial:nth-child(2) .num{ color: var(--teal); filter: brightness(1.35); }

  .footnote{
    text-align:center;
    color: var(--parchment-dim);
    font-size: 13px;
    line-height: 1.9;
  }
  .footnote strong{
    color: var(--parchment);
    font-weight: 600;
  }

  @media (max-width: 420px){
    .card{ padding: 34px 22px 30px; }
    h1{ font-size: 22px; }
    .dial .num{ font-size: 24px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>

<div class="stars"></div>

<div class="stage">
  <div class="astrolabe" aria-hidden="true">
    <svg viewBox="0 0 340 340" xmlns="http://www.w3.org/2000/svg">
      <circle cx="170" cy="170" r="150" fill="none" stroke="var(--gold)" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="170" cy="170" r="120" fill="none" stroke="var(--gold)" stroke-opacity="0.25" stroke-width="1"/>
      <circle cx="170" cy="170" r="90" fill="none" stroke="var(--teal)" stroke-opacity="0.3" stroke-width="1"/>
      <g stroke="var(--gold)" stroke-opacity="0.28" stroke-width="1">
        <line x1="170" y1="20" x2="170" y2="320"/>
        <line x1="20" y1="170" x2="320" y2="170"/>
        <line x1="55" y1="55" x2="285" y2="285"/>
        <line x1="285" y1="55" x2="55" y2="285"/>
      </g>
      <circle cx="170" cy="170" r="3.5" fill="var(--gold-soft)"/>
      <circle cx="170" cy="20" r="3" fill="var(--gold)" fill-opacity="0.7"/>
      <circle cx="320" cy="170" r="3" fill="var(--gold)" fill-opacity="0.7"/>
      <circle cx="170" cy="320" r="3" fill="var(--gold)" fill-opacity="0.7"/>
      <circle cx="20" cy="170" r="3" fill="var(--gold)" fill-opacity="0.7"/>
    </svg>
  </div>

  <div class="card">
    <div class="eyebrow-row" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold-soft)" stroke-width="1.4">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v5l3 2"/>
      </svg>
    </div>
    <h1>سن دقیقت رو بسنج</h1>
    <p class="sub">تاریخ تولدت رو وارد کن تا بگم دقیقاً چند سال، چند ماه و چند روزته.</p>

    <form id="ageForm" novalidate>
      <div class="field">
        <label for="bday">تاریخ تولد</label>
        <input type="date" id="bday" name="bday" required>
      </div>
      <div class="error" id="errMsg"></div>
      <button type="submit">محاسبه کن</button>
    </form>

    <div class="result" id="result">
      <div class="dials">
        <div class="dial">
          <div class="num" id="years">۰</div>
          <div class="lbl">سال</div>
        </div>
        <div class="dial">
          <div class="num" id="months">۰</div>
          <div class="lbl">ماه</div>
        </div>
        <div class="dial">
          <div class="num" id="days">۰</div>
          <div class="lbl">روز</div>
        </div>
      </div>
      <p class="footnote">یعنی تا امروز <strong id="totalDays">۰</strong> روز از تولدت گذشته.</p>
    </div>
  </div>
</div>

<script>
  const form = document.getElementById('ageForm');
  const errMsg = document.getElementById('errMsg');
  const result = document.getElementById('result');

  const faDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  function toFa(n){
    return String(n).replace(/\d/g, d => faDigits[d]);
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    errMsg.textContent = '';

    const val = document.getElementById('bday').value;
    if(!val){
      errMsg.textContent = 'لطفاً تاریخ تولدت رو وارد کن.';
      result.classList.remove('show');
      return;
    }

    const birth = new Date(val + 'T00:00:00');
    const today = new Date();
    today.setHours(0,0,0,0);

    if(birth > today){
      errMsg.textContent = 'این تاریخ هنوز نرسیده! یه تاریخ گذشته وارد کن.';
      result.classList.remove('show');
      return;
    }

    let years = today.getFullYear() - birth.getFullYear();
    let months = today.getMonth() - birth.getMonth();
    let days = today.getDate() - birth.getDate();

    if(days < 0){
      months -= 1;
      const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
      days += prevMonth.getDate();
    }
    if(months < 0){
      years -= 1;
      months += 12;
    }

    const msPerDay = 1000 * 60 * 60 * 24;
    const totalDays = Math.floor((today - birth) / msPerDay);

    document.getElementById('years').textContent = toFa(years);
    document.getElementById('months').textContent = toFa(months);
    document.getElementById('days').textContent = toFa(days);
    document.getElementById('totalDays').textContent = toFa(totalDays.toLocaleString('en-US'));

    result.classList.add('show');
  });
</script>

</body>
</html>
